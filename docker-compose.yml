x-shared-env: &shared-env
  STORAGE_BACKEND: tinydb
  DATA_DIR: ./data
  JWT_SECRET: change-me-to-a-long-random-string
  ADMIN_USER: admin
  ADMIN_PASSWORD: admin123
  JWT_EXPIRES_MIN: 60
  INTERNAL_API_KEY: dev-key-change-me

services:

  client-server:
    build: ./services/client-server
    ports:
      - "${CLIENT_SERVER_PORT:-8001}:8001"
    environment:
      INTERNAL_API_KEY: dev-key-change-me
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chatbot-api:
    build:
      context: .
      dockerfile: services/chatbot-api/Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    ports:
      - "${CHATBOT_API_PORT:-8000}:8000"
    environment:
      <<: *shared-env
      CLIENT_SERVER_URL: http://client-server:8001
      MONGO_URI: mongodb://mongo:27017/scchatbot
    volumes:
      - chatbot-data:/app/data
    depends_on:
      client-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  telegram-worker:
    build:
      context: .
      dockerfile: services/chatbot-api/Dockerfile
    command: python telegram_worker.py
    environment:
      <<: *shared-env
      CLIENT_SERVER_URL: http://client-server:8001
      MONGO_URI: mongodb://mongo:27017/scchatbot
    volumes:
      - chatbot-data:/app/data
    depends_on:
      client-server:
        condition: service_healthy
      chatbot-api:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: services/chatbot-api/Dockerfile
    command: python seed_data.py
    environment:
      <<: *shared-env
      CLIENT_SERVER_URL: http://client-server:8001
    volumes:
      - chatbot-data:/app/data
    depends_on:
      client-server:
        condition: service_healthy
    profiles:
      - seed
    restart: "no"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    profiles:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  chatbot-data:
  mongo-data:
