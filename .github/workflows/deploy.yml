name: Deploy

on:
  workflow_dispatch:

env:
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/sc-chatbot' }}
  WEB_ADMIN_PORT: ${{ secrets.WEB_ADMIN_PORT || '30001' }}
  CHATBOT_API_PORT: ${{ secrets.CHATBOT_API_PORT || '30002' }}
  CLIENT_SERVER_PORT: ${{ secrets.CLIENT_SERVER_PORT || '30003' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "--- Pull latest code ---"
            cd ${{ env.DEPLOY_PATH }}
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ngocphamttdt/sc-chatbot.git
            if [ ! -d "${{ env.DEPLOY_PATH }}/.git" ]; then
              git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/ngocphamttdt/sc-chatbot.git .
            else
              git fetch origin
            fi

            git reset --hard origin/${{ github.ref_name }}

            echo "--- Ensure per-service .env files exist ---"
            for f in services/chatbot-api/.env services/client-server/.env; do
              if [ ! -f "$f" ]; then
                cp "${f}.example" "$f"
                echo "Created $f from template"
              fi
            done

            echo "--- Write .env with port overrides ---"
            cat > .env <<EOF
            WEB_ADMIN_PORT=${{ env.WEB_ADMIN_PORT }}
            CHATBOT_API_PORT=${{ env.CHATBOT_API_PORT }}
            CLIENT_SERVER_PORT=${{ env.CLIENT_SERVER_PORT }}
            EOF

            echo "--- Remove stale TinyDB settings so seed re-runs fresh ---"
            docker compose down 2>/dev/null || true
            VOLUME_PATH=$(docker volume inspect sc-chatbot_chatbot-data --format '{{.Mountpoint}}' 2>/dev/null || echo "")
            if [ -n "$VOLUME_PATH" ] && [ -f "$VOLUME_PATH/global_settings.json" ]; then
              rm -f "$VOLUME_PATH/global_settings.json"
              echo "Removed stale global_settings.json"
            fi

            echo "--- Rebuild and start services ---"
            docker compose --profile seed up --build -d

            echo "--- Health check ---"
            for i in $(seq 1 12); do
              if curl -sf http://localhost:${{ env.CHATBOT_API_PORT }}/health > /dev/null 2>&1; then
                echo "chatbot-api health check passed"
                break
              fi
              echo "Waiting for chatbot-api (attempt $i/12)..."
              sleep 5
            done

            for i in $(seq 1 6); do
              if curl -sf http://localhost:${{ env.WEB_ADMIN_PORT }}/ > /dev/null 2>&1; then
                echo "web-admin health check passed"
                break
              fi
              echo "Waiting for web-admin (attempt $i/6)..."
              sleep 5
            done

            echo "--- Prune old images ---"
            docker image prune -af --filter "until=24h"

            echo "--- Deploy complete ---"
